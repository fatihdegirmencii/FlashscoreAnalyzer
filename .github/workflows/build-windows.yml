name: Windows EXE Olustur

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: EXE olustur
        run: |
          pyinstaller --noconfirm --clean --onefile --name FlashscoreAnalyzer ^
            --collect-all selenium ^
            --hidden-import=waitress ^
            app.py

      - name: EXE dosyasini paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\FlashscoreAnalyzer.exe release\
          Copy-Item KULLANIM.txt release\
          Compress-Archive -Path release\* -DestinationPath FlashscoreAnalyzer-Windows.zip

      - name: Indirilebilir dosya olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: FlashscoreAnalyzer-Windows
          path: FlashscoreAnalyzer-Windows.zip
          if-no-files-found: error
