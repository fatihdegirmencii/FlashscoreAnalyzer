name: Windows EXE Olustur
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketleri kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: EXE olustur
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name FlashscoreAnalyzer `
            --collect-all selenium `
            --collect-submodules selenium.webdriver `
            --hidden-import=selenium.webdriver.chrome.webdriver `
            --hidden-import=selenium.webdriver.chrome.options `
            --hidden-import=waitress `
            app.py
      - name: Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\FlashscoreAnalyzer.exe release\
          Copy-Item CSV_SABLONU.csv release\
          Copy-Item KULLANIM.txt release\
          Compress-Archive release\* FlashscoreAnalyzer-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FlashscoreAnalyzer-Windows
          path: FlashscoreAnalyzer-Windows.zip
